<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" fill="#EEF0E6" />
  <rect x="8" y="29" width="48" height="25" rx="2" fill="#223047" />
  <polygon points="32,9 58,27 6,27" fill="#223047" />
  <rect x="14" y="35" width="6" height="15" fill="#EEF0E6" />
  <rect x="26" y="35" width="6" height="15" fill="#EEF0E6" />
  <rect x="38" y="35" width="6" height="15" fill="#EEF0E6" />
  <rect x="6" y="54" width="52" height="4" rx="1" fill="#223047" />

  <!-- 屋根の投入口 -->
  <rect x="28" y="16" width="8" height="2.4" rx="1" fill="#0D1520" />
  <!-- 入口 -->
  <rect x="27" y="46" width="10" height="8" rx="1.5" fill="#0D1520" />

  <!-- 入金コイン(上空から屋根の投入口へ) -->
  <g>
    <circle cx="0" cy="0" r="6" fill="#B98F2C" stroke="#EEF0E6" strokeWidth="2" />
    <text x="0" y="2.6" fontSize="7" fontWeight="700" fill="#223047" textAnchor="middle" fontFamily="serif">円</text>
    <animateMotion
      path="M6 5 C 16 -5, 24 5, 32 17"
      dur="2.6s"
      repeatCount="indefinite"
      calcMode="linear"
    />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="2.6s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" additive="sum" values="1;1;0.3" keyTimes="0;0.7;1" dur="2.6s" repeatCount="indefinite" />
  </g>

  <!-- 出金コイン(入口から外へ) -->
  <g>
    <circle cx="0" cy="0" r="5" fill="#A63D33" stroke="#EEF0E6" strokeWidth="2" />
    <text x="0" y="2.2" fontSize="6" fontWeight="700" fill="#EEF0E6" textAnchor="middle" fontFamily="serif">円</text>
    <animateMotion
      path="M32 51 C 40 53, 50 49, 58 41"
      dur="2.6s"
      begin="1.3s"
      repeatCount="indefinite"
      calcMode="linear"
    />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.75;1" dur="2.6s" begin="1.3s" repeatCount="indefinite" />
  </g>
</svg>
